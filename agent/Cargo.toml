[package]
name = "raspberry-agent"
version = "0.1.0"
edition = "2021"
description = "Raspberry App Agent — telemetry + shell daemon for the Pi (Phase 1 LAN MVP)"
license = "MIT"

[[bin]]
name = "raspberry-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
portable-pty = "0.8"
qrcode = "0.14"
rand = "0.8"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
