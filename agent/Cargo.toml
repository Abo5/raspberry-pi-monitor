[package]
name = "raspberry-agent"
version = "0.1.0"
edition = "2021"
description = "Raspberry App Agent — telemetry + shell + actions + alerts daemon for the Pi"
license = "MIT"

[[bin]]
name = "raspberry-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
portable-pty = "0.8"
# We only render the pairing QR as terminal unicode — the default "image"
# feature pulls in image@0.25 (needs rustc 1.88; the Pi ships 1.85), so drop it.
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
# In-process JPEG encoding of captured screen frames (grim on Debian has JPEG
# support disabled, so we encode the PPM ourselves).
jpeg-encoder = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
